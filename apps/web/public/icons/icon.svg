<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b1b30" />
      <stop offset="100%" stop-color="#1b0c17" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#be5a2c" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="100" fill="url(#grid)" />

  <!-- Outer Technical Blueprint Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#be5a2c" stroke-width="2.5" stroke-dasharray="8 6" stroke-opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#be5a2c" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#be5a2c" stroke-width="2.5" stroke-opacity="0.85" />
  <circle cx="256" cy="256" r="28" fill="#be5a2c" />

  <!-- Crosshair Reticle -->
  <line x1="256" y1="48" x2="256" y2="464" stroke="#be5a2c" stroke-width="2.5" stroke-opacity="0.75" />
  <line x1="48" y1="256" x2="464" y2="256" stroke="#be5a2c" stroke-width="2.5" stroke-opacity="0.75" />

  <!-- Technical Corner Registration Ticks -->
  <path d="M 176 176 L 196 176 M 176 176 L 176 196" fill="none" stroke="#ece5de" stroke-width="2" />
  <path d="M 336 176 L 316 176 M 336 176 L 336 196" fill="none" stroke="#ece5de" stroke-width="2" />
  <path d="M 176 336 L 196 336 M 176 336 L 176 316" fill="none" stroke="#ece5de" stroke-width="2" />
  <path d="M 336 336 L 316 336 M 336 336 L 336 316" fill="none" stroke="#ece5de" stroke-width="2" />

  <!-- Center Cross Cut -->
  <line x1="256" y1="240" x2="256" y2="272" stroke="#ece5de" stroke-width="2.5" />
  <line x1="240" y1="256" x2="272" y2="256" stroke="#ece5de" stroke-width="2.5" />
</svg>
